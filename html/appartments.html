<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квартира - G.I.L Apartments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/appartments.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body data-page="apartment" data-title-key="pages.apartment.title">
    <div data-site-header></div>

    <main class="apartment_page">
        <section class="gallery">
            <div class="thumbs">
                <img src="../images/flats/1.png" alt="Мініатюра квартири" class="thumb_image">
                <img src="../images/flats/2.png" alt="Мініатюра квартири" class="thumb_image">
                <img src="../images/flats/3.png" alt="Мініатюра квартири" class="thumb_image">
            </div>

            <div class="main_photo">
                <img id="image" src="../images/flats/1.png" alt="Фото квартири">
            </div>
        </section>

        <aside class="apartment_info">
            <h1 id="title">Квартира</h1>
            <p class="apartment_meta" id="capacity">2 гості</p>
            <p class="apartment_meta" id="area">48 м²</p>
            <p class="apartment_meta" id="address">Адреса</p>
            <div class="price" id="price">0 ₴ / день</div>
            <a href="./booking.html" class="rent_btn" data-i18n="common.actions.rent">Орендувати</a>
        </aside>

        <section class="apartment_features_panel" id="apartmentFeaturesBox">
            <h2 data-i18n="pages.apartment.amenities">Зручності</h2>
            <div class="apartment_features" id="apartmentFeatures"></div>
        </section>

        <section class="description_box">
            <h2 data-i18n="pages.apartment.description">Опис</h2>
            <p id="description" data-i18n="pages.apartment.loading">Інформація про квартиру завантажується.</p>
        </section>

        <section class="map_box">
            <h2 data-i18n="pages.apartment.location">Розташування</h2>
            <div id="map"></div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/i18next@24.2.3/i18next.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-i18next@1.2.1/jquery-i18next.min.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/site.js"></script>
    <script src="../js/appartments.js"></script>
    <script src="../js/appartmentsPage.js"></script>
</body>
</html>
