<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - G.I.L Apartments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../css/booking.css">
</head>
<body data-page="booking">
    <div data-site-header></div>

    <main class="page_shell">
        <h1 class="page_title">Booking</h1>
        <p class="page_lead">Send a request and we will contact you to confirm dates and stay details.</p>

        <section class="booking_layout">
            <div class="page_card">
                <h2>Booking details</h2>
                <form class="site_form">
                    <input type="text" placeholder="First name">
                    <input type="text" placeholder="Last name">
                    <input type="tel" placeholder="+380">
                    <input type="date">
                    <input type="date">
                    <textarea placeholder="Booking note"></textarea>
                    <button type="submit" class="site_button">Send request</button>
                </form>
            </div>

            <div class="info_grid booking_info">
                <div class="info_item">
                    <h2>Confirmation</h2>
                    <p>We manually confirm apartment availability before final approval.</p>
                </div>
                <div class="info_item">
                    <h2>Response time</h2>
                    <p>We usually reply the same day by messenger or phone.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="../../js/site.js"></script>
</body>
</html>
