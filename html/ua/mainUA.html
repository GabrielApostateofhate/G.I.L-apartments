<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квартири подобово - Ужгород</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body data-page="main">
    <div data-site-header></div>

    <main class="main_catalog">
        <aside class="filter_bar" aria-label="Фільтр">
            <button class="filter_button" type="button" id="filterToggle" aria-expanded="false" aria-controls="filterPanel">Фільтр</button>
        </aside>

        <div class="filter_overlay" id="filterOverlay"></div>

        <section class="filter_panel" id="filterPanel" aria-label="Панель фільтра">
            <form class="filter_form" id="filterForm">
                <div class="filter_group">
                    <label for="rooms">Кількість кімнат</label>
                    <select id="rooms" name="rooms">
                        <option value="">Всі оголошення</option>
                        <option value="1">1 кімната</option>
                        <option value="2">2 кімнати</option>
                        <option value="3">3 кімнати</option>
                    </select>
                </div>

                <div class="filter_group">
                    <label>Ціна</label>
                    <div class="filter_range">
                        <select name="price_from">
                            <option value="">Від:</option>
                            <option value="500">500</option>
                            <option value="800">800</option>
                            <option value="1000">1000</option>
                            <option value="1300">1300</option>
                            <option value="1500">1500</option>
                        </select>
                        <select name="price_to">
                            <option value="">До:</option>
                            <option value="900">900</option>
                            <option value="1200">1200</option>
                            <option value="1500">1500</option>
                            <option value="1900">1900</option>
                            <option value="2200">2200</option>
                        </select>
                    </div>
                </div>

                <div class="filter_group">
                    <label>Місяць</label>
                    <div class="filter_range filter_range_month">
                        <select name="month_from">
                            <option value="">Від</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                        <span class="filter_separator">-</span>
                        <select name="month_to">
                            <option value="">До</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                    </div>
                </div>

                <div class="filter_group">
                    <label>Кількість спальних місць</label>
                    <div class="filter_range">
                        <select name="beds_from">
                            <option value="">Від:</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                        <select name="beds_to">
                            <option value="">До:</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                        </select>
                    </div>
                </div>

                <div class="filter_group">
                    <label for="favorite">Додані у вподобані</label>
                    <select id="favorite" name="favorite">
                        <option value="">Всі оголошення</option>
                        <option value="true">Лише вибрані</option>
                    </select>
                </div>

                <div class="filter_actions">
                    <button type="button" class="filter_action_button filter_action_clear" id="filterReset">Скинути</button>
                    <button type="submit" class="filter_action_button">Застосувати</button>
                </div>
            </form>
        </section>

        <section class="hero_flat">
            <a href="./appartments.html?id=1" class="hero_flat_link" id="heroFlatLink">
                <span class="hero_price_tag" id="heroPriceTag">1200 ₴ / день</span>
                <span class="hero_image_stage">
                    <img src="../../images/flats/1.png" alt="Рекомендована квартира" class="hero_flat_image hero_flat_image_current" id="heroFlatImageCurrent">
                    <img src="../../images/flats/1.png" alt="" class="hero_flat_image hero_flat_image_next" id="heroFlatImageNext">
                </span>
            </a>
        </section>

        <section class="flats_catalog" aria-label="Список квартир" id="flatsCatalog"></section>
        <p class="catalog_empty" id="catalogEmpty" hidden>За вашим фільтром квартири не знайдені.</p>
    </main>

    <script src="../../js/site.js"></script>
    <script src="../../js/appartments.js"></script>
    <script src="../../js/main.js"></script>
</body>
</html>
