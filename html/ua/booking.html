<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронювання - G.I.L Apartments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/css/booking.css">
</head>
<body data-page="booking">
    <div data-site-header></div>

    <main class="page_shell">
        <h1 class="page_title">Бронювання</h1>
        <p class="page_lead">Залиште заявку, і ми зв’яжемося з вами для підтвердження дат та деталей проживання.</p>

        <section class="booking_layout">
            <div class="page_card">
                <h2>Дані для бронювання</h2>
                <form class="site_form">
                    <input type="text" placeholder="Ім’я">
                    <input type="text" placeholder="Прізвище">
                    <input type="tel" placeholder="+380">
                    <input type="date">
                    <input type="date">
                    <textarea placeholder="Коментар до бронювання"></textarea>
                    <button type="submit" class="site_button">Надіслати заявку</button>
                </form>
            </div>

            <div class="info_grid booking_info">
                <div class="info_item">
                    <h2>Підтвердження</h2>
                    <p>Ми уточнюємо доступність квартири та підтверджуємо заявку вручну.</p>
                </div>
                <div class="info_item">
                    <h2>Час відповіді</h2>
                    <p>Зазвичай відповідаємо протягом дня у месенджері або телефоном.</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/site.js"></script>
</body>
</html>
