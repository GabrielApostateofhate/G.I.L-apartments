<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirect</title>
<script>
const savedLang = window.localStorage.getItem("siteLanguage");
const lang = savedLang || navigator.language || navigator.userLanguage;

if(lang.startsWith("uk")){
    window.location.href = "./html/main.html";
}else{
    window.location.href = "./html/main.html";
}
</script>
</head>
<body>
</body>
</html>
